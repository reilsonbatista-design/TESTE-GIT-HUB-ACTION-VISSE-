name: Node.js CI

on:
  push:
    branches:
      - main  # O workflow será executado em pushes no branch principal
  pull_request:
    branches:
      - main  # Também será executado quando um pull request for feito para o branch principal

jobs:
  build:
    runs-on: ubuntu-latest  # O processo será executado em uma máquina virtual com Ubuntu

    steps:
    - name: Checar o código do repositório
      uses: actions/checkout@v2  # Faz o checkout do código do repositório

    - name: Configurar o Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'  # A versão do Node.js usada no projeto

    # Instalar dependências no diretório 'client'
    - name: Instalar dependências do Client
      run: |
        cd client  # Vai para a pasta 'client'
        npm install  # Instala as dependências do 'client'

    # Instalar dependências no diretório 'server'
    - name: Instalar dependências do Server
      run: |
        cd server  # Vai para a pasta 'server'
        npm install  # Instala as dependências do 'server'

    # Rodar os testes do diretório 'client'
    - name: Rodar os testes do Client
      run: |
        cd client  # Vai para a pasta 'client'
        npm test  # Executa os testes do 'client'

    # Rodar os testes do diretório 'server'
    - name: Rodar os testes do Server
      run: |
        cd server  # Vai para a pasta 'server'
        npm test  # Executa os testes do 'server'
